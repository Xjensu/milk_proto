<system>
  log_level info
</system>

# Docker services can send structured records with the fluentd logging driver.
# The forward input is also useful for non-Docker workers that already emit
# Fluent forward events.
<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

# Docker Desktop exposes JSON-file logs through the mounted container log
# directory. This keeps collection independent of the Docker logging driver;
# the forward input above remains available for workers that emit Fluent
# Forward records directly.
<source>
  @type tail
  path /var/lib/docker/containers/*/*-json.log
  pos_file /tmp/docker-containers.pos
  tag docker.logs
  read_from_head false
  <parse>
    @type json
    time_key time
    time_type string
    keep_time_key true
  </parse>
</source>

<filter **>
  @type record_transformer
  enable_ruby true
  <record>
    service ${tag.split(".").first}
    collected_at ${Time.now.utc.iso8601}
  </record>
</filter>

<match **>
  @type loki
  url http://loki:3100
  extra_labels {"environment":"local"}
  <label>
    service
    environment
  </label>
  <buffer>
    @type file
    path /tmp/fluentd-loki-buffer
    flush_interval 5s
    retry_forever true
  </buffer>
</match>
