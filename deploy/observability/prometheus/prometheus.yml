global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: schedule_web
    metrics_path: /metrics
    dns_sd_configs:
      - names: [schedule_web]
        type: A
        port: 3000
    relabel_configs:
      - target_label: service
        replacement: schedule_web
      - target_label: environment
        replacement: production
