user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_header_timeout 10s;
  client_body_timeout 30s;
  send_timeout 30s;
  client_max_body_size 21m;
  # Query strings can contain signed capabilities. Never put them in access logs.
  log_format safe '$remote_addr $request_method $uri $status $request_time $upstream_addr';
  access_log /dev/stdout safe;
  include /run/policy/lan.geo;
  geo $blocked_ip { default 0; include /etc/nginx/denylist.geo; }
  map "$request_method:$uri" $login_key {
    default "";
    ~^POST:/(session|password)$ $binary_remote_addr;
    ~^POST:/api/auth/(sessions|sessions/refresh|password)$ $binary_remote_addr;
  }
  map $uri $general_key { default $binary_remote_addr; ~^/assets/ ""; }
  limit_req_zone $general_key zone=general:10m rate=20r/s;
  limit_req_zone $login_key zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=ops:1m rate=6r/m;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  limit_req_status 429;
  limit_conn_status 429;
  include /run/nginx/upstreams.conf;
  server {
    listen 80 default_server;
    server_name _;
    if ($blocked_ip) { return 403; }
    limit_req zone=general burst=100 nodelay;
    limit_req zone=login burst=5 nodelay;
    limit_conn connections 50;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    proxy_next_upstream off;
    error_page 502 504 =503 /_unavailable;
    error_page 429 =429 /_limited;
    location = /_unavailable { internal; default_type text/plain; return 503 "Сервис временно недоступен. Повторите запрос позже.\n"; }
    location = /_limited { internal; default_type text/plain; add_header Retry-After 60 always; return 429 "Слишком много запросов. Подождите минуту.\n"; }
    location ~ (^|/)\. { return 404; }
    location ~* \.(env|sql|sqlite3?|log|bak|pem|key)$ { return 404; }
    location ~ ^/(admin|cabinet)(/|$) {
      if ($trusted_lan = 0) { return 403; }
      proxy_pass http://rails_web;
      proxy_buffering off;
      proxy_cache off;
    }
    location ~ ^/(session|password|consent|metrics|up|readyz)(/|$) {
      if ($trusted_lan = 0) { return 403; }
      proxy_pass http://rails_web;
    }
    location = /ops {
      if ($trusted_lan = 0) { return 403; }
      return 308 /ops/;
    }
    location ^~ /ops/ {
      if ($trusted_lan = 0) { return 403; }
      limit_req zone=general burst=100 nodelay;
      limit_req zone=ops burst=4 nodelay;
      rewrite ^/ops/(.*)$ /$1 break;
      proxy_pass http://ops_service;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1225s;
    }
    location ~ ^/api/admin/internal(/|$) { return 404; }
    location ~ ^/api/(admin|auth)(/|$) {
      if ($trusted_lan = 0) { return 403; }
      rewrite ^/api(.*)$ $1 break;
      proxy_pass http://hanami_api;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }
    location /api/ { return 404; }
    location / {
      limit_except GET { deny all; }
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_pass http://rails_web;
    }
  }
}
