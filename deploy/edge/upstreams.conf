# Native Docker DNS refresh survives backend container recreation.
upstream rails_web {
  zone rails_web 64k;
  server schedule_web:3000 resolve max_fails=2 fail_timeout=5s;
  keepalive 8;
}
upstream hanami_api {
  zone hanami_api 64k;
  server api_geteway:2300 resolve max_fails=2 fail_timeout=5s;
  keepalive 8;
}
