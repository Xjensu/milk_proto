# Single-host production: Compose DNS owns service addresses; no registry or registrar sidecars.
name: ${COMPOSE_PROJECT_NAME:-milk_schedule}
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  scheduler:
    image: ${IMAGE_NAMESPACE:-xjensu}/table-scheduler:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}
    container_name: milk_schedule_scheduler
    environment:
      NOTICE_EXPORT_PUBLIC_ENDPOINT: ${NOTICE_EXPORT_PUBLIC_ENDPOINT:-http://${LAN_BIND_IP:?Run preflight}:9000}
      TRUSTED_PROXIES: ${INGRESS_IP:?Run preflight}/32
      WORKER_HEARTBEAT_MAX_AGE: '1200'
      DISCOVERY_ENABLED: '0'
      SCHEDULE_PROGRESS_API_URL: http://api_geteway:2300/admin/internal/schedule_generation_runs
    networks:
    - discovery
    expose:
    - '8100'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
    logging: *id001
    cpus: 1.0
    mem_limit: 2g
  schedule_web:
    image: ${WEB_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/table-bsut-by:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
    - .env.local
    environment:
      RAILS_ENV: production
      NOTICE_EXPORT_PUBLIC_ENDPOINT: ${NOTICE_EXPORT_PUBLIC_ENDPOINT:-http://${LAN_BIND_IP:?Run preflight}:9000}
      TRUSTED_PROXIES: ${INGRESS_IP:?Run preflight}/32
      WORKER_HEARTBEAT_MAX_AGE: '1200'
      DISCOVERY_ENABLED: '0'
      API_GETEWAY_URL: http://api_geteway:2300
    depends_on:
      api_geteway:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - --max-time
      - '5'
      - http://127.0.0.1:3000/readyz
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped
    logging: *id001
    networks:
    - discovery
    deploy:
      # One replica by default; an existing explicit WEB_REPLICAS remains authoritative.
      replicas: ${WEB_REPLICAS:-1}
  api_geteway:
    image: ${API_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/table-api:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    container_name: api_geteway
    networks:
    - discovery
    env_file:
    - .env.local
    environment:
      AVRO_SCHEMA_DIR: /schemas/avro
      NOTICE_EXPORT_PUBLIC_ENDPOINT: ${NOTICE_EXPORT_PUBLIC_ENDPOINT:-http://${LAN_BIND_IP:?Run preflight}:9000}
      TRUSTED_PROXIES: ${INGRESS_IP:?Run preflight}/32
      WORKER_HEARTBEAT_MAX_AGE: '1200'
      HANAMI_ENV: production
      RACK_ENV: production
      DISCOVERY_ENABLED: '0'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: http://minio:9000
      SCHEDULER_URL: http://scheduler:8100
      CLAMAV_MAX_SIGNATURE_AGE_SECONDS: ${CLAMAV_MAX_SIGNATURE_AGE_SECONDS:-259200}
    volumes:
    - clamav-data:/var/lib/clamav:ro
    - ./schemas:/schemas:ro
    - ./deploy/antivirus/check-signatures.sh:/opt/antivirus/check-signatures.sh:ro
    logging: *id001
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:2300/readyz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    depends_on:
      clamav_signatures:
        condition: service_started
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped
  ops_console:
    image: ${API_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/table-api:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    container_name: milk_schedule_ops_console
    command:
    - ruby
    - bin/local_ops_console
    env_file:
    - .env.local
    - ./deploy/ops/.env.local
    environment:
      HANAMI_ENV: production
      RACK_ENV: production
      HOME: /tmp
      BUNDLE_USER_HOME: /tmp/bundle
      TMPDIR: /tmp
      OPS_CONSOLE_HOST: 0.0.0.0
      OPS_CONSOLE_PORT: '8090'
      NOTICE_EXPORT_PUBLIC_ENDPOINT: ${NOTICE_EXPORT_PUBLIC_ENDPOINT:-http://${LAN_BIND_IP:?Run preflight}:9000}
      TRUSTED_PROXIES: ${INGRESS_IP:?Run preflight}/32
      WORKER_HEARTBEAT_MAX_AGE: '1200'
      DISCOVERY_ENABLED: '0'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: http://minio:9000
      SCHEDULER_URL: http://scheduler:8100
    user: 65532:65532
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    expose:
    - '8090'
    networks:
    - discovery
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *id001
    healthcheck:
      test:
      - CMD
      - ruby
      - -rsocket
      - -e
      - TCPSocket.new('127.0.0.1', 8090).close
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    profiles:
    - operations
  outbox_relay:
    image: ${API_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/table-api:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    container_name: outbox_relay
    env_file:
    - .env.local
    environment:
      AVRO_SCHEMA_DIR: /schemas/avro
      NOTICE_EXPORT_PUBLIC_ENDPOINT: ${NOTICE_EXPORT_PUBLIC_ENDPOINT:-http://${LAN_BIND_IP:?Run preflight}:9000}
      OUTBOX_STREAM_KEY: schedule:event_outbox
      OUTBOX_STREAM_MAXLEN: '100000'
      TRUSTED_PROXIES: ${INGRESS_IP:?Run preflight}/32
      WORKER_HEARTBEAT_MAX_AGE: '1200'
      HANAMI_ENV: production
      RACK_ENV: production
      DISCOVERY_ENABLED: '0'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: http://minio:9000
      SCHEDULER_URL: http://scheduler:8100
    volumes:
    - ./schemas:/schemas:ro
    logging: *id001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command:
    - bundle
    - exec
    - ruby
    - bin/outbox_relay
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
    - discovery
  media_sanitizer:
    image: ${API_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/table-api:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    container_name: media_sanitizer
    env_file:
    - .env.local
    environment:
      AVRO_SCHEMA_DIR: /schemas/avro
      MEDIA_REQUIRE_VIRUS_SCAN: 'true'
      MEDIA_SANITIZE_TIMEOUT: '30'
      MEDIA_SANITIZER_POLL_INTERVAL: '5'
      MEDIA_SANITIZER_BATCH_SIZE: '10'
      MEDIA_SANITIZER_CONCURRENCY: '3'
      MEDIA_SANITIZER_SCAN_TIMEOUT: '300'
      MEDIA_SANITIZER_MAX_ATTEMPTS: '5'
      MEDIA_IMAGE_MAX_PIXELS: '100000000'
      NOTICE_EXPORT_PUBLIC_ENDPOINT: ${NOTICE_EXPORT_PUBLIC_ENDPOINT:-http://${LAN_BIND_IP:?Run preflight}:9000}
      TRUSTED_PROXIES: ${INGRESS_IP:?Run preflight}/32
      WORKER_HEARTBEAT_MAX_AGE: '1200'
      HANAMI_ENV: production
      RACK_ENV: production
      DISCOVERY_ENABLED: '0'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: http://minio:9000
      SCHEDULER_URL: http://scheduler:8100
      CLAMAV_MAX_SIGNATURE_AGE_SECONDS: ${CLAMAV_MAX_SIGNATURE_AGE_SECONDS:-259200}
    volumes:
    - clamav-data:/var/lib/clamav:ro
    - ./schemas:/schemas:ro
    - ./deploy/antivirus/check-signatures.sh:/opt/antivirus/check-signatures.sh:ro
    logging: *id001
    depends_on:
      clamav_signatures:
        condition: service_started
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command:
    - bundle
    - exec
    - ruby
    - bin/media_sanitizer
    networks:
    - discovery
  notice_export_worker:
    image: ${API_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/table-api:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    container_name: notice_export_worker
    env_file:
    - .env.local
    environment:
      AVRO_SCHEMA_DIR: /schemas/avro
      NOTICE_EXPORT_PUBLIC_ENDPOINT: ${NOTICE_EXPORT_PUBLIC_ENDPOINT:-http://${LAN_BIND_IP:?Run preflight}:9000}
      TRUSTED_PROXIES: ${INGRESS_IP:?Run preflight}/32
      WORKER_HEARTBEAT_MAX_AGE: '1200'
      HANAMI_ENV: production
      RACK_ENV: production
      DISCOVERY_ENABLED: '0'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: http://minio:9000
      SCHEDULER_URL: http://scheduler:8100
    volumes:
    - ./schemas:/schemas:ro
    logging: *id001
    depends_on:
      api_geteway:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped
    command:
    - bundle
    - exec
    - ruby
    - bin/notice_export_worker
    networks:
    - discovery
  schedule_generation_worker:
    image: ${API_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/table-api:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    container_name: schedule_generation_worker
    env_file:
    - .env.local
    environment:
      AVRO_SCHEMA_DIR: /schemas/avro
      SCHEDULE_GENERATION_WORKER: '1'
      SCHEDULE_GENERATION_POLL_INTERVAL: '3'
      SCHEDULE_GENERATION_BATCH_SIZE: '1'
      NOTICE_EXPORT_PUBLIC_ENDPOINT: ${NOTICE_EXPORT_PUBLIC_ENDPOINT:-http://${LAN_BIND_IP:?Run preflight}:9000}
      TRUSTED_PROXIES: ${INGRESS_IP:?Run preflight}/32
      WORKER_HEARTBEAT_MAX_AGE: '1200'
      HANAMI_ENV: production
      RACK_ENV: production
      DISCOVERY_ENABLED: '0'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: http://minio:9000
      SCHEDULER_URL: http://scheduler:8100
    networks:
    - discovery
    volumes:
    - ./schemas:/schemas:ro
    logging: *id001
    depends_on:
      api_geteway:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    restart: unless-stopped
    command:
    - bundle
    - exec
    - ruby
    - bin/schedule_generation_worker
  clamav_signatures:
    image: ${CLAMAV_IMAGE:-clamav/clamav@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0}
    entrypoint:
    - sh
    - /opt/antivirus/update-signatures.sh
    volumes:
    - clamav-data:/signatures
    - ./deploy/antivirus/update-signatures.sh:/opt/antivirus/update-signatures.sh:ro
    - ./deploy/antivirus/check-signatures.sh:/opt/antivirus/check-signatures.sh:ro
    environment:
      CLAMAV_MAX_SIGNATURE_AGE_SECONDS: ${CLAMAV_MAX_SIGNATURE_AGE_SECONDS:-259200}
    networks:
    - edge
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - sh
      - /opt/antivirus/check-signatures.sh
      interval: 60s
      timeout: 5s
      retries: 30
      start_period: 30s
      start_interval: 2s
  excel_processor:
    image: ${EXCEL_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/excel-processor:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    container_name: excel_processor
    env_file:
    - .env.local
    environment:
      AVRO_SCHEMA_DIR: /schemas/avro
      NOTICE_EXPORT_PUBLIC_ENDPOINT: ${NOTICE_EXPORT_PUBLIC_ENDPOINT:-http://${LAN_BIND_IP:?Run preflight}:9000}
      TRUSTED_PROXIES: ${INGRESS_IP:?Run preflight}/32
      WORKER_HEARTBEAT_MAX_AGE: '1200'
      DISCOVERY_ENABLED: '0'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: http://minio:9000
      SCHEDULER_URL: http://scheduler:8100
    volumes:
    - ./schemas:/schemas:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *id001
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    command:
    - sh
    - -c
    - python migrations/apply_migrations.py && python run.py
    networks:
    - discovery
  db:
    image: ${POSTGRES_IMAGE:-pgrouting/pgrouting:15-3.5-develop}
    restart: unless-stopped
    container_name: postgres
    env_file:
    - .env.local
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
    - discovery
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: redis
    restart: unless-stopped
    volumes:
    - ./storage/redis_data:/data
    env_file:
    - .env.local
    command:
    - sh
    - -c
    - redis-server --protected-mode yes --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec
    networks:
    - discovery
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
  minio:
    image: ${MINIO_IMAGE:-xjensu/table-minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2}
    restart: unless-stopped
    container_name: hanami_minio
    env_file:
    - .env.local
    command: server /data --console-address ":9001"
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s
      start_interval: 2s
    networks:
    - discovery
    - edge
    ports:
    - ${LAN_BIND_IP:?Run preflight}:9000:9000
  minio_init:
    image: ${MINIO_INIT_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/table-minio-init:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
    - .env.local
    entrypoint:
    - python3
    - /opt/discovery/python/minio_init.py
    restart: 'no'
    networks:
    - discovery
    environment:
      DISCOVERY_ENABLED: '0'
    volumes:
    - ./deploy/discovery/python/minio_init.py:/opt/discovery/python/minio_init.py:ro
  nginx:
    image: ${EDGE_IMAGE:-${IMAGE_NAMESPACE:-xjensu}/table-edge:${IMAGE_TAG:?Set IMAGE_TAG in .env.local}}
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    ports:
    - ${HTTP_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80
    volumes:
    - ./deploy/generated/lan.geo:/run/policy/lan.geo:ro
    - ./deploy/edge/denylist.geo:/etc/nginx/denylist.geo:ro
    networks:
      discovery:
        ipv4_address: ${INGRESS_IP:?Run preflight}
      edge: {}
    restart: unless-stopped
    logging: *id001
    depends_on:
      schedule_web:
        condition: service_healthy
      api_geteway:
        condition: service_healthy
volumes:
  clamav-data: {}
  postgres-data: null
  minio-data: null
networks:
  discovery:
    internal: true
    enable_ipv6: false
    ipam:
      config:
      - subnet: ${DISCOVERY_SUBNET:?Run preflight}
        ip_range: ${DISCOVERY_IP_RANGE:?Run preflight}
  edge: {}
