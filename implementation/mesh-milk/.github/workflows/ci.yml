# CI matrix per doc 12 §7.6 (ROADMAP Stage 0).
# Six targets: x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu, aarch64-apple-darwin
# (the three host jobs), aarch64-linux-android + thumbv7em-none-eabihf (cross-check),
# aarch64-apple-ios (ios-check) — plus cargo-deny, the layer test, MIRI on mmp-types,
# and the flash/RAM size gate (trivially passing at Stage 0, hard-enforced at Stage 7).

name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo check --workspace --target aarch64-linux-android

  ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: cargo check --workspace --target aarch64-apple-ios

  # The no_std proof + size gate: the Core-profile crates must build for
  # thumbv7em-none-eabihf. Budget (doc 12 §7.6): mmp-types+crypto+core+router
  # ≤ 256 KiB flash / ≤ 48 KiB static RAM ⚠. A real gate needs a linked image
  # (Stage 7, nRF52 profile); until then this job proves no_std builds and
  # reports rlib sizes for trend visibility — wired, trivially passing.
  no-std-size-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: >
          cargo build --release --target thumbv7em-none-eabihf
          -p mmp-types -p mmp-crypto -p mmp-core -p mmp-router -p mmp-rs-code
      - name: report rlib sizes (informational until Stage 7)
        run: ls -l target/thumbv7em-none-eabihf/release/*.rlib

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  layer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p layer-check

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri test -p mmp-types
