[package]
name = "mmp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "bundle core, session FSM, sync engine (docs 03/06/11)"

[features]
# `std` gates the Noise-backed session engine (snow); the data structures are
# no_std+alloc throughout.
default = ["std"]
std = ["mmp-crypto/std"]
alloc = []

[dependencies]
mmp-types = { path = "../mmp-types" }
mmp-crypto = { path = "../mmp-crypto", default-features = false }
blake3 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true
