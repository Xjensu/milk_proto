[package]
name = "mmp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PC node + debugging/inspection tool"

[dependencies]
mmp-node = { path = "../mmp-node" }
mmp-core = { path = "../mmp-core" }
mmp-crypto = { path = "../mmp-crypto" }
mmp-store = { path = "../mmp-store" }
mmp-tal = { path = "../mmp-tal", features = ["std"] }
mmp-tal-btleplug = { path = "../mmp-tal-btleplug" }
mmp-tal-peripheral = { path = "../mmp-tal-peripheral" }
mmp-types = { path = "../mmp-types" }
blake3 = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

# `connect`/`send` drive a real node over BLE central role (mmp-tal-btleplug,
# HANDOFF M5, handbook §4.2). `listen` mirrors them over BLE peripheral role
# (mmp-tal-peripheral, HANDOFF M5b) — Linux/BlueZ only for now, see that
# crate's docs. `demo` still runs two nodes over an in-memory link and needs
# none of this.

[lints]
workspace = true
