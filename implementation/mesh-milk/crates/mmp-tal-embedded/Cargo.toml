[package]
name = "mmp-tal-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "nRF52 (nrf-softdevice) / ESP32 (NimBLE) TAL"
keywords = ["ble", "nrf52", "esp32", "embedded"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
# Keep the future backend's dependency edge explicit: if `mmp-tal` ever grows
# a host-only default feature, the embedded crate must remain no_std by
# construction rather than depending on today's empty default feature set.
mmp-tal = { path = "../mmp-tal", default-features = false }

[lints]
workspace = true
