[package]
name = "mmp-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "discrete-event simulator (OQ-4/OQ-5, doc 12 s8)"
keywords = ["simulation", "ble", "mesh", "dtn"]
categories = ["simulation"]

[dependencies]
mmp-types = { path = "../mmp-types" }
mmp-core = { path = "../mmp-core" }
mmp-node = { path = "../mmp-node" }
mmp-tal = { path = "../mmp-tal", features = ["std"] }
# Adversary (E5-S7, handbook §4.8) bypasses `Node` and speaks raw frames: it
# needs the Noise XX handshake driver + Ed25519 signing directly.
mmp-crypto = { path = "../mmp-crypto" }

[lints]
workspace = true
