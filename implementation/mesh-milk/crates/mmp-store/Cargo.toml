[package]
name = "mmp-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "BundleStore impls: checksummed snapshot (std); flash-log (no_std) reserved"
keywords = ["persistence", "snapshot", "storage"]
categories = ["filesystem"]

[features]
# The checksummed filesystem snapshot remains the default host behavior.
# `std` is forwarded explicitly so `--no-default-features` cannot
# accidentally pull the host-only dependency graph into a future embedded
# backend.
default = ["std"]
std = ["mmp-core/std", "mmp-crypto/std"]

[dependencies]
mmp-types = { path = "../mmp-types" }
mmp-crypto = { path = "../mmp-crypto", default-features = false }
mmp-core = { path = "../mmp-core", default-features = false }
blake3 = { workspace = true }

[lints]
workspace = true
