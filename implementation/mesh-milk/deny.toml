# cargo-deny configuration (ROADMAP Stage 0: present and green from the first commit).
# The layering ban (tokio & TAL impls below mmp-node) is tools/layer-check's job —
# cargo-deny bans are workspace-global, and tokio is legitimate in mmp-node and above.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
