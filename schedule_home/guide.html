<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Гайд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="guide.css" />
</head>
<body class="manual-page">
  <header class="site-header">
    <a class="schedule-back" href="index.html" aria-label="Назад">‹</a>
    <button class="profile-button" type="button" aria-label="Открыть форму авторизации" aria-controls="authDialog" aria-expanded="false">
      <svg class="profile-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M8.25 9C8.25 6.92893 9.92893 5.25 12 5.25C14.0711 5.25 15.75 6.92893 15.75 9C15.75 11.0711 14.0711 12.75 12 12.75C9.92893 12.75 8.25 11.0711 8.25 9ZM12 6.75C10.7574 6.75 9.75 7.75736 9.75 9C9.75 10.2426 10.7574 11.25 12 11.25C13.2426 11.25 14.25 10.2426 14.25 9C14.25 7.75736 13.2426 6.75 12 6.75Z"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M1.25 12C1.25 6.06294 6.06294 1.25 12 1.25C17.9371 1.25 22.75 6.06294 22.75 12C22.75 17.9371 17.9371 22.75 12 22.75C6.06294 22.75 1.25 17.9371 1.25 12ZM12 2.75C6.89137 2.75 2.75 6.89137 2.75 12C2.75 14.5456 3.77827 16.851 5.4421 18.5235C5.6225 17.5504 5.97694 16.6329 6.68837 15.8951C7.75252 14.7915 9.45416 14.25 12 14.25C14.5457 14.25 16.2474 14.7915 17.3115 15.8951C18.023 16.6329 18.3774 17.5505 18.5578 18.5236C20.2217 16.8511 21.25 14.5456 21.25 12C21.25 6.89137 17.1086 2.75 12 2.75ZM17.1937 19.6554C17.0918 18.4435 16.8286 17.5553 16.2318 16.9363C15.5823 16.2628 14.3789 15.75 12 15.75C9.62099 15.75 8.41761 16.2628 7.76815 16.9363C7.17127 17.5553 6.90811 18.4434 6.80622 19.6553C8.28684 20.6618 10.0747 21.25 12 21.25C13.9252 21.25 15.7131 20.6618 17.1937 19.6554Z"/>
      </svg>
    </button>
  </header>

  <main class="book-guide" id="bookGuide">
    <section class="book-viewport" aria-label="Интерактивный мануал">
      <div class="book-scene" id="bookScene">
        <div class="book" id="guideBook" aria-live="polite">
          <div class="book-cover book-cover--left" aria-hidden="true"></div>
          <div class="book-cover book-cover--right" aria-hidden="true"></div>
          <div class="book-paper-stack book-paper-stack--left" aria-hidden="true"></div>
          <div class="book-paper-stack book-paper-stack--right" aria-hidden="true"></div>
          <div class="book-placeholder book-placeholder--left" id="bookLeftPlaceholder" aria-hidden="true">
            <span>?</span>
            <small>01—06</small>
          </div>
          <div class="book-placeholder book-placeholder--right" id="bookRightPlaceholder" aria-hidden="true">
            <span>конец</span>
          </div>
          <div class="book-sheets" id="bookSheets"></div>
          <div class="book-spine" aria-hidden="true"></div>
        </div>
      </div>

      <div class="book-meta" aria-label="Положение в гайде">
        <span class="book-page-index" id="bookPageIndex">01</span>
        <div class="book-progress" id="bookProgress" aria-hidden="true"></div>
        <span class="book-drag-hint">перетащите край страницы</span>
      </div>
    </section>
  </main>

  <footer class="site-footer" aria-label="Служебные ссылки">
    <button type="button" id="contactsButton" aria-controls="contactsDialog" aria-expanded="false">Контакты</button>
    <button type="button" id="cookieButton" aria-controls="cookieDialog" aria-expanded="false">Cookies</button>
    <a href="https://example.com" target="_blank" rel="noreferrer">Ссылка</a>
  </footer>

  <template id="guidePage0">
    <article class="leaflet-page leaflet-page--intro">
      <header class="leaflet-page-head"><span>01</span><span>Расписание</span></header>
      <h1>Как найти<br />расписание</h1>
      <div class="leaflet-menu">
        <div><span class="menu-mark">01</span><b>Группа</b><i>→</i></div>
        <div><span class="menu-mark">02</span><b>Преподаватель</b><i>→</i></div>
        <div><span class="menu-mark">03</span><b>Аудитория</b><i>→</i></div>
      </div>
      <div class="leaflet-flow" aria-hidden="true">
        <div class="flow-box"><span></span><span></span><span></span></div><i>→</i>
        <div class="flow-card"><span></span><span></span><span></span></div><i>→</i>
        <div class="flow-grid"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
    </article>
  </template>

  <template id="guidePage1">
    <article class="leaflet-page">
      <header class="leaflet-page-head"><span>02</span><span>Группа</span></header>
      <h1>Факультет<br />Курс<br />Группа</h1>
      <div class="leaflet-selector-row">
        <div><small>Курс</small><b>1&nbsp;&nbsp;<em>2</em>&nbsp;&nbsp;3&nbsp;&nbsp;4&nbsp;&nbsp;5</b></div>
        <div><small>Подгруппа</small><b>Все&nbsp;&nbsp;/&nbsp;&nbsp;1&nbsp;&nbsp;/&nbsp;&nbsp;2</b></div>
        <div><small>Неделя</small><b><em>Чётная</em>&nbsp;&nbsp;/&nbsp;&nbsp;Нечётная</b></div>
      </div>
      <div class="leaflet-faculty-stack" aria-hidden="true">
        <div class="faculty-mini is-selected"><b>Факультет</b><span>Выбрать</span><i>→</i></div>
        <div class="faculty-mini"><b>Факультет</b><span>Выбрать</span><i>→</i></div>
        <div class="faculty-mini"><b>Факультет</b><span>Выбрать</span><i>→</i></div>
      </div>
      <p class="leaflet-caption">Выберите факультет, курс и группу</p>
    </article>
  </template>

  <template id="guidePage2">
    <article class="leaflet-page">
      <header class="leaflet-page-head"><span>03</span><span>Преподаватель</span></header>
      <h1>Поиск<br />по ФИО</h1>
      <div class="leaflet-search-field"><span>Иванов Илья Сергеевич</span><i>⌕</i></div>
      <div class="leaflet-result-card">
        <div><small>ФИО</small><b>Иванов Илья Сергеевич</b></div>
        <div><small>Кафедра</small><b>Кафедра информатики</b></div>
      </div>
      <div class="leaflet-mini-schedule" aria-hidden="true">
        <div class="ms-head"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span></div>
        <div class="ms-grid">
          <i></i><i class="on">ПИ-21</i><i></i><i class="on">ИВТ-31</i><i></i>
          <i class="on">ИВТ-31</i><i></i><i class="on">ПИ-21</i><i></i><i class="on">ЭС-22</i>
        </div>
      </div>
    </article>
  </template>

  <template id="guidePage3">
    <article class="leaflet-page">
      <header class="leaflet-page-head"><span>04</span><span>Аудитория</span></header>
      <h1>Поиск<br />по номеру</h1>
      <div class="leaflet-search-field"><span>203</span><i>⌕</i></div>
      <div class="leaflet-room-card">
        <div><small>Аудитория</small><b>203</b></div>
        <div><small>Тип</small><b>Лекционная</b></div>
        <div><small>Корпус</small><b>2</b></div>
      </div>
      <div class="room-plan" aria-hidden="true">
        <span class="board"></span>
        <span class="desk d1"></span><span class="desk d2"></span><span class="desk d3"></span><span class="desk d4"></span>
        <span class="desk d5"></span><span class="desk d6"></span><span class="desk d7"></span><span class="desk d8"></span>
        <span class="door"></span>
      </div>
    </article>
  </template>

  <template id="guidePage4">
    <article class="leaflet-page leaflet-page--schedule">
      <header class="leaflet-page-head"><span>05</span><span>Расписание</span></header>
      <h1>Неделя</h1>
      <div class="leaflet-week-controls">
        <span class="is-active">Чётная</span><span>Нечётная</span><span>Все</span><span>1</span><span>2</span>
      </div>
      <div class="leaflet-table">
        <div class="lt-head"><span></span><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span></div>
        <div class="lt-row"><b>08:30</b><i></i><i class="event"><strong>ПИ</strong><small>203 · Лаб.</small></i><i></i><i class="event"><strong>БД</strong><small>305 · Лек.</small></i><i></i></div>
        <div class="lt-row"><b>10:15</b><i class="event"><strong>ОС</strong><small>101 · Лек.</small></i><i></i><i class="event"><strong>ПИ</strong><small>203 · Лаб.</small></i><i></i><i class="event"><strong>БД</strong><small>305 · Пр.</small></i></div>
        <div class="lt-row"><b>12:00</b><i></i><i class="event"><strong>Сети</strong><small>214 · Лаб.</small></i><i></i><i class="event"><strong>ОС</strong><small>101 · Пр.</small></i><i></i></div>
      </div>
      <p class="leaflet-caption">Нажмите на занятие — откроются подробности</p>
    </article>
  </template>

  <template id="guidePage5">
    <article class="leaflet-page leaflet-page--changes">
      <header class="leaflet-page-head"><span>06</span><span>Переносы</span></header>
      <h1>Изменения<br />в расписании</h1>
      <div class="change-legend"><span class="added"></span><b>Добавлено</b><span class="removed"></span><b>Отменено</b></div>
      <div class="change-list">
        <div class="change-item is-added"><time>10:15</time><b>Программирование</b><span>203</span><small>добавлено</small></div>
        <div class="change-item is-removed"><time>12:00</time><b>Базы данных</b><span>305</span><small>отменено</small></div>
      </div>
      <div class="detail-links">
        <div><small>Преподаватель</small><b>Иванов И.С.</b><i>→</i></div>
        <div><small>Аудитория</small><b>203</b><i>→</i></div>
      </div>
      <p class="leaflet-caption">Из подробностей можно перейти к преподавателю или аудитории</p>
    </article>
  </template>

  <div class="auth-backdrop" id="authDialog" aria-hidden="true">
    <section class="auth-panel" role="dialog" aria-modal="true" aria-label="Авторизация">
      <button class="auth-close" type="button" aria-label="Закрыть форму авторизации">×</button>
      <form class="auth-form" id="authForm" autocomplete="on">
        <label class="field"><span class="sr-only">Логин</span><input type="text" name="login" placeholder="Логин" autocomplete="username" required /></label>
        <label class="field"><span class="sr-only">Пароль</span><input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required /></label>
        <button class="auth-submit" type="submit">Войти</button>
      </form>
    </section>
  </div>

  <div class="contacts-backdrop" id="contactsDialog" aria-hidden="true">
    <section class="contacts-panel" role="dialog" aria-modal="true" aria-label="Контакты">
      <button class="plain-close contacts-close" type="button" aria-label="Закрыть контакты">×</button>
      <div class="contacts-list">
        <a class="contact-item" href="https://t.me/telegram" target="_blank" rel="noreferrer"><span>Telegram</span><span>@telegram</span><span>↗</span></a>
        <a class="contact-item" href="tel:+000000000000"><span>Телефон</span><span>+000 000 00 00</span><span>↗</span></a>
        <a class="contact-item" href="mailto:hello@example.com"><span>Email</span><span>hello@example.com</span><span>↗</span></a>
      </div>
    </section>
  </div>

  <div class="cookie-backdrop" id="cookieDialog" aria-hidden="true">
    <section class="cookie-panel" role="dialog" aria-modal="true" aria-label="Cookies">
      <div class="cookie-head cookie-head--plain"><button class="cookie-close" type="button" aria-label="Закрыть настройки cookies">×</button></div>
      <div class="cookie-options">
        <div class="cookie-row"><div><strong>Необходимые</strong></div><span class="cookie-required">ON</span></div>
        <label class="cookie-row" for="functionalCookies"><div><strong>Функциональные</strong></div><span class="switch"><input id="functionalCookies" type="checkbox" /><span class="switch-track" aria-hidden="true"><span></span></span></span></label>
        <label class="cookie-row" for="analyticsCookies"><div><strong>Аналитика</strong></div><span class="switch"><input id="analyticsCookies" type="checkbox" /><span class="switch-track" aria-hidden="true"><span></span></span></span></label>
      </div>
      <div class="cookie-actions">
        <button type="button" class="cookie-action cookie-action--ghost" id="necessaryOnly">Только необходимые</button>
        <button type="button" class="cookie-action cookie-action--ghost" id="acceptAllCookies">Принять все</button>
        <button type="button" class="cookie-action cookie-action--primary" id="saveCookies">Сохранить</button>
      </div>
    </section>
  </div>

  <script src="guide.js"></script>
</body>
</html>
